message FileUploadRequest {
  bytes data = 1;
  string filename = 2;
  string guid = 3;
  string source_type = 4; // "scp" | "ftp"
}

message ConnectRequest {
  string version = 1;
}

message ConnectReply {
  string message = 1;
}


// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}

message ResponseLookupRequest {
  string guid = 1;
  string command_type = 2;
  string lookup_key = 3;
}
