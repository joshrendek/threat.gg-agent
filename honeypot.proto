message QueryRequest {
 string Query = 1;
 string guid = 2;
 string command_type = 3; // empty => postgres for backwards compatibility
}

message CommandResponse {
  string Response = 1;
  bool Matched = 2; // true = an authored row was found (even if Response is empty)
}

message FtpRequest {
  string username = 1;
  string password = 2;
  string remote_addr = 3;
