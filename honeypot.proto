message TelnetLoginRequest {
  string remote_addr = 1;
  string guid = 2;
  string username = 3;
  string password = 4;
}

message TelnetCommandRequest {
  string guid = 1;
  string command = 2;
}

message RdpRequest {
  string remote_addr = 1;
  string guid = 2;
