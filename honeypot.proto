syntax = "proto3";

option go_package = "github.com/joshrendek/threat.gg;proto";
package honeypot;

// The greeting service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

service Honeypot {
  rpc Connect (ConnectRequest) returns (ConnectReply) {}
  rpc SaveFtpLogin(FtpRequest) returns (SaveReply) {}
  rpc SaveElasticsearch(ElasticsearchRequest) returns (SaveReply) {}
  rpc SaveHttp(HttpRequest) returns (SaveReply) {}
  rpc SaveSshLogin(SshLoginRequest) returns (SaveReply) {}
  rpc SavePostgresLogin(PostgresRequest) returns (SaveReply) {}
  rpc SaveMysqlLogin(MysqlRequest) returns (SaveReply) {}
  rpc SaveMssqlLogin(MssqlRequest) returns (SaveReply) {}
  // SaveKubeletRequest stores bounded metadata for one HTTPS Kubelet request.
  rpc SaveKubeletRequest(KubeletRequest) returns (SaveReply) {}
  // SaveConsulRequest stores bounded metadata for one Consul HTTP API request.
  rpc SaveConsulRequest(ConsulRequest) returns (SaveReply) {}
  // SaveAmqpSession stores one bounded AMQP 0-9-1 or 1.0 probe session.
  rpc SaveAmqpSession(AmqpSessionRequest) returns (SaveReply) {}
  // SaveAdbSession stores one bounded Android Debug Bridge transport session.
  rpc SaveAdbSession(AdbSessionRequest) returns (SaveReply) {}
  rpc SaveQuery(QueryRequest) returns (SaveReply) {}
  rpc SaveHttpHeaders(HttpHeaderRequest) returns (SaveReply) {}
  rpc SaveShellCommand(ShellCommandRequest) returns (SaveReply) {}
  rpc GetCommandResponse(CommandRequest) returns (CommandResponse) {}
  rpc SaveResponseLookup(ResponseLookupRequest) returns (SaveReply) {}
  rpc SaveOpenclawConnect(OpenclawRequest) returns (SaveReply) {}
  rpc SaveKafkaConnect(KafkaRequest) returns (SaveReply) {}
  rpc SaveKafkaApiRequest(KafkaApiRequest) returns (SaveReply) {}
  rpc SaveRedisConnect(RedisConnectRequest) returns (SaveReply) {}
  rpc SaveRedisCommand(RedisCommandRequest) returns (SaveReply) {}
  rpc SaveMqttConnect(MqttConnectRequest) returns (SaveReply) {}
  rpc SaveMqttCommand(MqttCommandRequest) returns (SaveReply) {}
  rpc SaveDockerRequest(DockerRequest) returns (SaveReply) {}
  rpc SaveMongoConnect(MongoConnectRequest) returns (SaveReply) {}
  rpc SaveMongoCommand(MongoCommandRequest) returns (SaveReply) {}
  rpc SaveMemcachedConnect(MemcachedConnectRequest) returns (SaveReply) {}
  rpc SaveMemcachedCommand(MemcachedCommandRequest) returns (SaveReply) {}
  rpc SaveEtcdRequest(EtcdRequest) returns (SaveReply) {}
  rpc SaveSmbConnect(SmbRequest) returns (SaveReply) {}
  rpc SaveLdapBind(LdapBindRequest) returns (SaveReply) {}
  rpc SaveLdapSearch(LdapSearchRequest) returns (SaveReply) {}
  rpc SaveTelnetLogin(TelnetLoginRequest) returns (SaveReply) {}
  rpc SaveTelnetCommand(TelnetCommandRequest) returns (SaveReply) {}
  rpc SaveRdpConnect(RdpRequest) returns (SaveReply) {}
  rpc SaveVncConnect(VncRequest) returns (SaveReply) {}
  rpc SaveJenkinsRequest(JenkinsRequest) returns (SaveReply) {}
  rpc SaveSmtpLogin(SmtpLoginRequest) returns (SaveReply) {}
  rpc SaveSmtpEmail(SmtpEmailRequest) returns (SaveReply) {}
  rpc SaveVllm(LlmRequest) returns (SaveReply) {}
  rpc SaveOllama(LlmRequest) returns (SaveReply) {}
  rpc SaveRay(LlmRequest) returns (SaveReply) {}
  rpc SaveLocalai(LlmRequest) returns (SaveReply) {}
  // SaveLmstudio stores one bounded native, OpenAI, or Anthropic API interaction.
  rpc SaveLmstudio(LlmRequest) returns (SaveReply) {}
  rpc SaveLlamacpp(LlmRequest) returns (SaveReply) {}
  rpc SaveComfyui(LlmRequest) returns (SaveReply) {}
  rpc SaveFile(FileUploadRequest) returns (SaveReply) {}
  rpc SaveMcp(McpRequest) returns (SaveReply) {}
  // SaveS3Request stores bounded metadata for one emulated MinIO/S3 operation.
  rpc SaveS3Request(S3Request) returns (SaveReply) {}
  // SaveIcsProbe stores one bare-TCP probe against an ICS/SCADA port (Modbus,
  // S7comm, DNP3, EtherNet/IP, OPC UA, ...). This is a measurement instrument,
  // not a honeypot: it answers nothing and emulates nothing, it only records
  // that something connected. Deliberately NOT an Attacker/AttackDatum row --
  // see grpc_server/icsprobe.go.
  rpc SaveIcsProbe(IcsProbeRequest) returns (SaveReply) {}
  // SaveS7commSession stores one bounded S7comm (Siemens S7-300 PLC, TCP/102)
  // session. Unlike SaveIcsProbe, this IS a real attack type: someone
  // speaking S7comm to a fake PLC is an attacker, and stopping a PLC is
  // unambiguous intent. Goes through the normal Attacker/AttackDatum path --
  // see grpc_server/s7comm.go.
  rpc SaveS7commSession(S7commSessionRequest) returns (SaveReply) {}
  // SaveModbusSession stores one bounded Modbus/TCP (Schneider M221 class,
  // TCP/502) session. Like SaveS7commSession and unlike SaveIcsProbe this IS
  // a real attack type -- writing coils or holding registers on a device you
  // do not own is an attempt to move a physical process -- so it goes through
  // the normal Attacker/AttackDatum path. See grpc_server/modbus.go.
  rpc SaveModbusSession(ModbusSessionRequest) returns (SaveReply) {}
  // GetLlmBundle serves the admin-authored LLM prompt-rule corpus (PRD 034).
  // Poll-and-cache, NOT a per-request lookup: the agent holds the compiled
  // bundle behind an atomic.Pointer and matches locally, so nothing on the
  // inference request path touches the network. known_version is the ETag; an
  // unchanged pull answers unchanged=true with no rules. Rides this service
  // (rather than a new HTTP surface) because the agent already holds an
  // authenticated TLS channel with API_KEY in metadata.
  rpc GetLlmBundle (LlmBundleRequest) returns (LlmBundleReply) {}

  // BYOK AI responses (PRD 041). The server answers attacker input with the
  // user's own OpenRouter key; NONE tells the agent to use its existing path.
  rpc GenerateResponse (GenerateRequest) returns (GenerateReply) {}
}

message SaveReply {
  string message = 1;
}

