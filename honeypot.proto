syntax = "proto3";

option go_package = "github.com/joshrendek/threat.gg;proto";
package honeypot;

// The greeting service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

service Honeypot {
  rpc Connect (ConnectRequest) returns (ConnectReply) {}
  rpc SaveFtpLogin(FtpRequest) returns (SaveReply) {}
  rpc SaveElasticsearch(ElasticsearchRequest) returns (SaveReply) {}
  rpc SaveHttp(HttpRequest) returns (SaveReply) {}
  rpc SaveSshLogin(SshLoginRequest) returns (SaveReply) {}
  rpc SavePostgresLogin(PostgresRequest) returns (SaveReply) {}
  rpc SaveMysqlLogin(MysqlRequest) returns (SaveReply) {}
  rpc SaveQuery(QueryRequest) returns (SaveReply) {}
  rpc SaveHttpHeaders(HttpHeaderRequest) returns (SaveReply) {}
  rpc SaveShellCommand(ShellCommandRequest) returns (SaveReply) {}
  rpc GetCommandResponse(CommandRequest) returns (CommandResponse) {}
  rpc SaveResponseLookup(ResponseLookupRequest) returns (SaveReply) {}
  rpc SaveOpenclawConnect(OpenclawRequest) returns (SaveReply) {}
  rpc SaveKafkaConnect(KafkaRequest) returns (SaveReply) {}
  rpc SaveKafkaApiRequest(KafkaApiRequest) returns (SaveReply) {}
  rpc SaveRedisConnect(RedisConnectRequest) returns (SaveReply) {}
  rpc SaveRedisCommand(RedisCommandRequest) returns (SaveReply) {}
  rpc SaveMqttConnect(MqttConnectRequest) returns (SaveReply) {}
  rpc SaveMqttCommand(MqttCommandRequest) returns (SaveReply) {}
  rpc SaveDockerRequest(DockerRequest) returns (SaveReply) {}
  rpc SaveMongoConnect(MongoConnectRequest) returns (SaveReply) {}
  rpc SaveMongoCommand(MongoCommandRequest) returns (SaveReply) {}
  rpc SaveMemcachedConnect(MemcachedConnectRequest) returns (SaveReply) {}
  rpc SaveMemcachedCommand(MemcachedCommandRequest) returns (SaveReply) {}
  rpc SaveEtcdRequest(EtcdRequest) returns (SaveReply) {}
  rpc SaveSmbConnect(SmbRequest) returns (SaveReply) {}
  rpc SaveLdapBind(LdapBindRequest) returns (SaveReply) {}
  rpc SaveLdapSearch(LdapSearchRequest) returns (SaveReply) {}
  rpc SaveTelnetLogin(TelnetLoginRequest) returns (SaveReply) {}
  rpc SaveTelnetCommand(TelnetCommandRequest) returns (SaveReply) {}
  rpc SaveRdpConnect(RdpRequest) returns (SaveReply) {}
  rpc SaveVncConnect(VncRequest) returns (SaveReply) {}
  rpc SaveJenkinsRequest(JenkinsRequest) returns (SaveReply) {}
  rpc SaveSmtpLogin(SmtpLoginRequest) returns (SaveReply) {}
  rpc SaveSmtpEmail(SmtpEmailRequest) returns (SaveReply) {}
  rpc SaveVllm(LlmRequest) returns (SaveReply) {}
  rpc SaveOllama(LlmRequest) returns (SaveReply) {}
  rpc SaveRay(LlmRequest) returns (SaveReply) {}
  rpc SaveLocalai(LlmRequest) returns (SaveReply) {}
  rpc SaveLlamacpp(LlmRequest) returns (SaveReply) {}
  rpc SaveComfyui(LlmRequest) returns (SaveReply) {}
  rpc SaveFile(FileUploadRequest) returns (SaveReply) {}
  rpc SaveMcp(McpRequest) returns (SaveReply) {}
  // GetLlmBundle serves the admin-authored LLM prompt-rule corpus (PRD 034).
  // Poll-and-cache, NOT a per-request lookup: the agent holds the compiled
  // bundle behind an atomic.Pointer and matches locally, so nothing on the
  // inference request path touches the network. known_version is the ETag; an
  // unchanged pull answers unchanged=true with no rules. Rides this service
  // (rather than a new HTTP surface) because the agent already holds an
  // authenticated TLS channel with API_KEY in metadata.
  rpc GetLlmBundle (LlmBundleRequest) returns (LlmBundleReply) {}
}

message SaveReply {
  string message = 1;
}

message CommandRequest {
  string Command = 1;
  string CommandType = 2; // honeypot protocol for the response lookup, e.g. "ssh"|"telnet"|"redis"|"postgres"; empty ⇒ "ssh" (back-compat)
}

message PostgresRequest {
  string username = 1;
  string password = 2;
  string remote_addr = 3;
  string guid = 4;
}

message MysqlRequest {
  string username = 1;
  string password = 2;
  string remote_addr = 3;
  string guid = 4;
}

message QueryRequest {
 string Query = 1;
 string guid = 2;
}

message CommandResponse {
  string Response = 1;
  bool Matched = 2; // true = an authored row was found (even if Response is empty)
}

message FtpRequest {
  string username = 1;
  string password = 2;
  string remote_addr = 3;
  string guid = 4;
}

message ElasticsearchRequest {
  string username = 1;
  string password = 2;
  string remote_addr = 3;
  map<string,string> headers = 4;
  string path = 5;
  map<string,string> form_data = 6;
  string method = 7;
  string guid = 8;
  string hostname = 9;
  string user_agent = 10;
}

message LlmRequest {
  string remote_addr = 1;
  string guid = 2;
  map<string,string> headers = 3;
  string path = 4;
  string method = 5;
  string body = 6;
  string model = 7;
  string user_agent = 8;
  int32 response_status = 9;
  string response_content_type = 10;
  int64 elapsed_ms = 11;
  LlmResponseSource response_source = 12;
  LlmStreamOutcome stream_outcome = 13;
  LlmReplyKind reply_kind = 14;
  // rule_id is set ONLY when an admin-authored corpus rule (PRD 034) produced
  // the reply, and carries that llm_prompt_rules row's uuid. The server parses
  // it as a UUID and drops anything else, exactly like allowLlmLabel bounds the
  // enum labels -- this field must never become a free-text sink.
  string rule_id = 15;
}

// These enums deliberately keep response telemetry bounded. The agent must
// classify its own handler result rather than forwarding response bodies or
// attacker-controlled labels to the server.
enum LlmResponseSource {
  LLM_RESPONSE_SOURCE_UNSPECIFIED = 0;
  LLM_RESPONSE_SOURCE_BUILTIN = 1;
  LLM_RESPONSE_SOURCE_COMMAND_RESPONSE = 2;
}

enum LlmStreamOutcome {
  LLM_STREAM_OUTCOME_UNSPECIFIED = 0;
  LLM_STREAM_OUTCOME_NOT_STREAMED = 1;
  LLM_STREAM_OUTCOME_COMPLETED = 2;
  LLM_STREAM_OUTCOME_ABORTED = 3;
}

enum LlmReplyKind {
  LLM_REPLY_KIND_UNSPECIFIED = 0;
  LLM_REPLY_KIND_STATIC_ENDPOINT = 1;
  LLM_REPLY_KIND_OLLAMA_DESCRIPTION = 2;
  LLM_REPLY_KIND_MODEL_INTRO_EN = 3;
  LLM_REPLY_KIND_MODEL_INTRO_ZH = 4;
  LLM_REPLY_KIND_ARITHMETIC = 5;
  LLM_REPLY_KIND_LITERAL_ECHO = 6;
  LLM_REPLY_KIND_VALIDATION_FACT = 7;
  LLM_REPLY_KIND_GENERIC_SAFE = 8;
  LLM_REPLY_KIND_ERROR = 9;
  LLM_REPLY_KIND_CODE_VALIDATION = 10;
  LLM_REPLY_KIND_CONSTRAINED_PROSE = 11;
  LLM_REPLY_KIND_ARITHMETIC_NONCE = 12;
  LLM_REPLY_KIND_MODEL_LIFECYCLE = 13;
  // Emitted when the agent's unsafe-prompt branch answers with refusal language.
  // Previously these were folded into GENERIC_SAFE, which made a jailbreak attempt
  // indistinguishable from a prompt we simply did not recognize.
  LLM_REPLY_KIND_SAFETY_REFUSAL = 14;
  // Emitted when an admin-authored corpus rule (PRD 034) answered. A rule may
  // instead declare a more specific telemetry_kind from the values above -- a
  // corpus rule answering an arithmetic probe still reports ARITHMETIC -- so the
  // historical per-kind series stays comparable across the corpus rollout.
  LLM_REPLY_KIND_CORPUS_RULE = 15;
}

// --- PRD 034: server-pushed LLM prompt-rules bundle ---

message LlmBundleRequest {
  // known_version is the ETag: the bundle version the caller already holds.
  // Empty means "I have nothing"; a match means the server answers
  // unchanged=true and sends no rules.
  string known_version = 1;
}

message LlmBundleReply {
  string version = 1;   // sha256 over the ordered enabled ruleset
  bool unchanged = 2;   // true ⇒ rules is empty, keep the bundle you have
  repeated LlmPromptRule rules = 3;
  // catalog is RESERVED for Phase 2 (server-pushed model catalog identity) and
  // is always empty in Phase 1. Reserved now so populating it later is not a
  // breaking wire change.
  repeated LlmCatalogModel catalog = 4;
}

// LlmPromptRule is one llm_prompt_rules row, minus the columns the fleet has no
// business seeing: `enabled` (the bundle only ever carries enabled rules) and
// `note` (an operator's campaign notes, which must not ship to 28 honeypots).
message LlmPromptRule {
  string id = 1;              // llm_prompt_rules.id, echoed back as LlmRequest.rule_id
  string match_kind = 2;      // contains|prefix|exact|regex|builtin_disable
  string pattern = 3;         // matched against the NORMALIZED prompt; for builtin_disable, names a builtin_id
  string reply_kind = 4;      // static|engine:echo_literal|engine:arithmetic
  string reply_text = 5;      // literal reply, served verbatim -- never interpolated (safety invariant 2)
  string telemetry_kind = 6;  // LlmReplyKind label to report for captures this rule answers
  string stage = 7;           // pre_builtin|post_builtin
  int32 priority = 8;         // lower evaluates first within a stage
  string language = 9;        // informational BCP-47-ish tag
}

// LlmCatalogModel carries model IDENTITY only -- never /api/show payloads, which
// stay byte-grounded in the agent binary next to their fixtures (PRD 034, "Should
// the model catalog ride the same bundle?"). Phase 2; never populated in Phase 1.
message LlmCatalogModel {
  string name = 1;
  int64 size = 2;
  string digest_seed = 3;
  string family = 4;
  string parameter_size = 5;
  string quantization_level = 6;
  int64 context_length = 7;
  int64 embedding_length = 8;
  repeated string capabilities = 9;
  string architecture = 10;
  int64 block_count = 11;
}

message McpRequest {
  string remote_addr = 1;
  string guid = 2;
  map<string,string> headers = 3;
  string transport = 4;
  string rpc_method = 5;
  string tool = 6;
  string body = 7;
  string user_agent = 8;
}

message HttpRequest {
  string username = 1;
  string password = 2;
  string remote_addr = 3;
  map<string,string> headers = 4;
  string path = 5;
  map<string,string> form_data = 6;
  string method = 7;
  string guid = 8;
  string hostname = 9;
  string user_agent = 10;
  string url = 11;
  string response = 12;
}

message SshLoginRequest {
  string remote_addr = 1;
  int32 remote_port = 2;
  string username = 3;
  string password = 4;
  string guid = 5;
  string version = 6;
  bytes public_key = 7;
  string key_type = 8;
  string login_type = 9;
}

message HttpHeaderRequest {
  map<string,string> headers = 1;
  string url = 2;
  map<string,string> form_data = 3;
  string method = 4;
  string guid = 5;
  string hostname = 6;
  string response = 7;
}

message ShellCommandRequest {
  string cmd = 1;
  string guid = 2;
}

message OpenclawRequest {
  string remote_addr = 1;
  string guid = 2;
  string auth_token = 3;
  string client_id = 4;
  string client_version = 5;
  string client_platform = 6;
  string client_mode = 7;
  string role = 8;
  repeated string scopes = 9;
  string device_id = 10;
  string device_public_key = 11;
  int32 min_protocol = 12;
  int32 max_protocol = 13;
  repeated string messages = 14;
}

message KafkaRequest {
  string remote_addr = 1;
  string guid = 2;
  string username = 3;
  string password = 4;
  string client_id = 5;
}

message KafkaApiRequest {
  string guid = 1;
  string api_key_name = 2;
  string data = 3;
}

message RedisConnectRequest {
  string remote_addr = 1;
  string guid = 2;
  string username = 3;
  string password = 4;
}

message RedisCommandRequest {
  string guid = 1;
  string command = 2;
}

message MqttConnectRequest {
  string remote_addr = 1;
  string guid = 2;
  string client_id = 3;
  string username = 4;
  string password = 5;
  string protocol_name = 6;
  int32 protocol_level = 7;
  bool clean_session = 8;
  int32 keepalive_secs = 9;
}

message MqttCommandRequest {
  string guid = 1;
  string command = 2;
}

message DockerRequest {
  string remote_addr = 1;
  string username = 2;
  string password = 3;
  map<string,string> headers = 4;
  string path = 5;
  string method = 6;
  string body = 7;
  string guid = 8;
  string hostname = 9;
  string user_agent = 10;
}

message MongoConnectRequest {
  string remote_addr = 1;
  string guid = 2;
  string username = 3;
  string password = 4;
  string client_version = 5;
}

message MongoCommandRequest {
  string guid = 1;
  string command = 2;
}

message MemcachedConnectRequest {
  string remote_addr = 1;
  string guid = 2;
  string protocol = 3;
}

message MemcachedCommandRequest {
  string guid = 1;
  string command = 2;
}

message EtcdRequest {
  string remote_addr = 1;
  string guid = 2;
  string data = 3;
}

message SmbRequest {
  string remote_addr = 1;
  string guid = 2;
  string ntlm_username = 3;
  string ntlm_domain = 4;
  string ntlm_workstation = 5;
  string ntlm_hash = 6;
  string os_version = 7;
  string smb_dialect = 8;
